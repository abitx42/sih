version: "3.8"

services:
  truthlens-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: truthlens_forensic_server
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - HOST=0.0.0.0
      - PORT=8000
      - ALLOWED_ORIGINS=http://localhost:8000,http://127.0.0.1:8000
    volumes:
      - truthlens_data:/app/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  truthlens_data:
    driver: local
